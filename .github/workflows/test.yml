# unit tests plus the Playwright e2e suite (behavior + visual baselines)
name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # same image as e2e/docker.sh so screenshots match the committed baselines.
    # keep the tag in sync with the exact @playwright/test version in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      E2E_IN_CONTAINER: 1
      # the e2e suite doesn't need cypress (used for doc images)
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
